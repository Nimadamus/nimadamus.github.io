name: Current Slate (sport hubs + homepage featured game)

# Oct 1 2026: the sport hubs (mlb.html, nfl.html, ncaaf.html, nba.html,
# nhl.html, ncaab.html, soccer.html and the *-previews.html hubs) froze on
# January to August content because they only changed when an AI writer or a
# manual ATLAS run produced an article. scripts/current_slate.py bakes the
# current ESPN slate into each hub (no AI, no new URLs, no sitemap changes),
# and sync_featured_game_preview.py falls back to today's marquee game when no
# Featured Game article exists for today.
#
# Commits pushed with GITHUB_TOKEN do not trigger the push-based Pages deploy,
# so this workflow dispatches pages-deploy.yml itself after pushing.

on:
  schedule:
    - cron: '30 12 * * *'   # 5:30 AM PDT
    - cron: '30 18 * * *'   # 11:30 AM PDT
    - cron: '30 22 * * *'   # 3:30 PM PDT
    - cron: '30 1 * * *'    # 6:30 PM PDT
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: current-slate
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Bake current slate into sport hubs
        id: slate
        continue-on-error: true
        run: python scripts/current_slate.py

      - name: Sync homepage Featured Game
        id: featured
        continue-on-error: true
        run: python scripts/sync_featured_game_preview.py

      - name: Update MLB picks today page
        id: picks
        continue-on-error: true
        run: python scripts/picks_today.py --sport mlb

      - name: Commit, push and deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add mlb.html mlb-previews.html nfl.html ncaaf.html nba.html nba-previews.html \
                  nhl.html nhl-previews.html ncaab.html college-basketball-previews.html \
                  soccer.html soccer-previews.html index.html mlb-picks-today.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Current slate: sport hubs and featured game $(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M PT')"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              gh workflow run pages-deploy.yml --ref main
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "ERROR: could not push after 3 attempts"
          exit 1

      - name: Report step outcomes (fails the run if any step failed)
        if: always()
        run: |
          echo "slate=${{ steps.slate.outcome }} featured=${{ steps.featured.outcome }} picks=${{ steps.picks.outcome }}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.slate.outcome }}" = failure ] || [ "${{ steps.featured.outcome }}" = failure ] || [ "${{ steps.picks.outcome }}" = failure ]; then
            echo "::error::A feed or the featured game sync failed; affected pages kept their previous content."
            exit 1
          fi
