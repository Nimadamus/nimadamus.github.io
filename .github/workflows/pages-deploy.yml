name: Deploy site to Pages

# Why this exists
# ---------------
# The legacy Pages builder walks the whole repository on every push. The
# published tree is ~630MB (videos/ alone is 334MB) and the builds began
# timing out: three consecutive builds of 5a1b75d47 errored or hung past the
# limit on 2026-08-06, so a pushed commit could not reach production at all
# while the site kept serving the previous build.
#
# The Actions path uploads a prepared tarball instead of asking the builder to
# process the repo, which is what removes the timeout.
#
# This site has NO build step of its own: every page is committed HTML. The one
# compiled thing, /pro/app, is built from the betlegend-pro repo and its dist
# is committed here. So "build" here means: copy the published tree, minus the
# things that are code rather than website.
#
# What is excluded, and why it is safe to exclude
# -----------------------------------------------
# Checked on 2026-08-06 against every .html/.css/.xml in the repo and all six
# sitemaps (1,851 URLs). Each excluded path is referenced by ZERO pages and
# appears in ZERO sitemap entries:
#
#   .git .github    repository plumbing, never served
#   node_modules    dependencies
#   __pycache__     bytecode cache
#   tests/          test code
#   hooks/          git hooks
#
# What is deliberately KEPT, against the temptation to shrink the artifact:
#
#   videos/         334MB, referenced by 6 live pages (proofofpicks.html,
#                   usc-vs-oregon-prediction-picks.html and four archive
#                   pages). Dropping it would break those pages.
#   scripts/        referenced by 1,493 pages -- this is the site's JS.
#   images/         referenced by 120 pages.
#   verification-screenshots/  no internal references, but it is published
#                   proof content that can be linked from outside the site.
#                   Unreferenced is not the same as unused.
#   CNAME .nojekyll the custom domain and the "do not run Jekyll" marker.
#                   Losing CNAME would drop betlegendpicks.com.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write        # create the Pages deployment
  id-token: write     # mint the OIDC token that deployment requires
  actions: read       # look up this run's uploaded artifact

# Never cancel a half-finished deploy; let it land, then run the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the published tree
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude 'tests/' \
            --exclude 'hooks/' \
            --exclude '_site' \
            ./ _site/

      - name: Prove the artifact still carries the site
        run: |
          # A deploy that silently drops the custom domain, the Jekyll opt-out
          # or the app bundle is worse than a failed build, because it looks
          # like it worked. Fail here instead.
          fail=0
          for f in CNAME .nojekyll index.html 404.html pro/app/index.html; do
            if [ ! -f "_site/$f" ]; then echo "MISSING: $f"; fail=1; fi
          done
          for d in videos images scripts pro/app handicapping-hub-archive; do
            if [ ! -d "_site/$d" ]; then echo "MISSING DIR: $d"; fail=1; fi
          done
          # The compiled app must bring its hashed assets with it.
          n=$(ls _site/pro/app/assets/index-*.js 2>/dev/null | wc -l)
          if [ "$n" -lt 1 ]; then echo "MISSING: pro/app/assets/index-*.js"; fail=1; fi
          echo "--- artifact ---"
          echo "files: $(find _site -type f | wc -l)"
          echo "size:  $(du -sh _site | cut -f1)"
          echo "app bundle: $(ls _site/pro/app/assets/index-*.js | xargs -n1 basename)"
          exit $fail

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://www.betlegendpicks.com/
    steps:
      # actions/deploy-pages is NOT used here, and only here.
      #
      # It hard-caps its own wait at ten minutes:
      #
      #   const MAX_TIMEOUT = 600000
      #   this.timeout = Math.min(timeoutInput, MAX_TIMEOUT)
      #
      # so the `timeout` input is accepted, logged, and then clamped. A ~490MB
      # artifact does not finish unpacking inside that window, and when the
      # clock runs out the action CANCELS the deployment it just started --
      # run 31107727344 died that way while the status was already
      # deployment_in_progress. The deploy was working; the action gave up.
      #
      # This step calls the same official endpoints the action calls
      # (POST /repos/{owner}/{repo}/pages/deployments, then
      #  GET  /repos/{owner}/{repo}/pages/deployments/{id}) with the workflow's
      # own GITHUB_TOKEN and OIDC token, and simply waits longer. It never
      # cancels: a slow deployment is allowed to finish.
      - name: Deploy the artifact through the Pages API, and wait for it
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_WAIT_SECONDS: '2700'   # 45 min; the artifact is ~490MB
          POLL_SECONDS: '15'
        run: |
          set -euo pipefail
          API="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          hdr=(-H "Authorization: Bearer ${GH_TOKEN}"
               -H "Accept: application/vnd.github+json"
               -H "X-GitHub-Api-Version: 2022-11-28")

          # 1. Never open a second deployment on top of a live one. The
          #    concurrency group already serialises this workflow, but a
          #    deployment can outlive the run that started it -- which is
          #    exactly what this step makes possible.
          echo "::group::Waiting for any in-flight Pages deployment"
          for i in $(seq 1 80); do
            st=$(curl -sS "${hdr[@]}" "$API/pages" | jq -r '.status // "unknown"')
            echo "  pages status: $st"
            [ "$st" != "building" ] && break
            sleep 15
          done
          echo "::endgroup::"

          # 2. The artifact this run just uploaded.
          arts=$(curl -sS "${hdr[@]}" "$API/actions/runs/${GITHUB_RUN_ID}/artifacts")
          ART_ID=$(echo "$arts" | jq -r '[.artifacts[]|select(.name=="github-pages")][0].id // empty')
          ART_SIZE=$(echo "$arts" | jq -r '[.artifacts[]|select(.name=="github-pages")][0].size_in_bytes // 0')
          if [ -z "$ART_ID" ]; then echo "No github-pages artifact on this run"; exit 1; fi
          echo "artifact id=$ART_ID size=${ART_SIZE} bytes"

          # 3. OIDC token. Same call actions/deploy-pages makes (default
          #    audience), which is why id-token: write is required above.
          ID_TOKEN=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"                        "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r '.value')
          if [ -z "$ID_TOKEN" ] || [ "$ID_TOKEN" = "null" ]; then echo "No OIDC token"; exit 1; fi

          # 4. Create the deployment.
          body=$(jq -nc --argjson a "$ART_ID" --arg v "$GITHUB_SHA" --arg t "$ID_TOKEN"                    '{artifact_id:$a, pages_build_version:$v, oidc_token:$t}')
          resp=$(curl -sS -X POST "${hdr[@]}" -d "$body" "$API/pages/deployments")
          DEP_ID=$(echo "$resp" | jq -r '.id // empty')
          if [ -z "$DEP_ID" ]; then
            # Instruction: on an explicit rejection, report exactly what the API said.
            echo "Pages API refused the deployment. Literal response:"
            echo "$resp"
            exit 1
          fi
          echo "deployment id: $DEP_ID"
          echo "page url     : $(echo "$resp" | jq -r '.page_url // "n/a"')"
          echo "DEPLOYMENT_ID=$DEP_ID"   >> "$GITHUB_ENV"
          echo "ARTIFACT_SIZE=$ART_SIZE" >> "$GITHUB_ENV"

          # 5. Poll to a real terminal state. No cancel on slowness -- that is
          #    the whole point of replacing the action.
          started=$(date +%s)
          while :; do
            sleep "$POLL_SECONDS"
            status=$(curl -sS "${hdr[@]}" "$API/pages/deployments/$DEP_ID" | jq -r '.status // "unknown_status"')
            elapsed=$(( $(date +%s) - started ))
            echo "  [${elapsed}s] $status"
            case "$status" in
              succeed)
                echo "Deployment $DEP_ID succeeded after ${elapsed}s."
                echo "DEPLOY_SECONDS=$elapsed" >> "$GITHUB_ENV"
                exit 0 ;;
              deployment_failed|deployment_content_failed|deployment_cancelled|deployment_lost)
                echo "Deployment $DEP_ID ended in: $status"
                curl -sS "${hdr[@]}" "$API/pages/deployments/$DEP_ID"
                exit 1 ;;
              deployment_queued|deployment_in_progress|deployment_attempt_error|not_found|unknown_status)
                : ;;   # keep waiting
            esac
            if [ "$elapsed" -ge "$MAX_WAIT_SECONDS" ]; then
              echo "Still '$status' after ${elapsed}s. NOT cancelling -- the"
              echo "deployment is left to finish; the next run waits for it."
              exit 1
            fi
          done
