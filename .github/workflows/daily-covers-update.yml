name: Daily BetLegend Update

on:
  schedule:
    # Runs at 6:30 AM PST (14:30 UTC)
    - cron: '30 14 * * *'
  workflow_dispatch:  # Allows manual trigger

permissions:
  contents: write
  actions: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  update-site:
    # OPTIONAL (Nima, Oct 1 2026): the Anthropic hub writer is intentionally off (no API
    # spend on it). The run shows as skipped, not failed. To turn it back on, set the
    # repository variable AI_HUB_WRITER to "on".
    if: vars.AI_HUB_WRITER == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml anthropic

      # NOTE: Handicapping Hub is handled by daily-handicapping-hub.yml at 15:00 UTC
      # Removed duplicate here to prevent merge conflicts

      - name: Run Auto-Content for NBA
        id: warn1
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/auto_content/main.py --sport nba

      - name: Run Auto-Content for NHL
        id: warn2
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/auto_content/main.py --sport nhl

      - name: Run Auto-Content for NFL
        id: warn3
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/auto_content/main.py --sport nfl

      - name: Run Auto-Content for NCAAB
        id: warn4
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/auto_content/main.py --sport ncaab

      - name: Run Auto-Content for NCAAF
        id: warn5
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/auto_content/main.py --sport ncaaf

      - name: Run Auto-Content for Soccer
        id: warn6
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/auto_content/main.py --sport soccer

      - name: Pull latest changes and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily BetLegend update - $(date +'%A, %B %d, %Y')

          - Handicapping Hub updated
          - All sports pages updated with analysis


          Auto-generated by GitHub Actions"
            bash scripts/ci_push_and_deploy.sh
          fi

      # Oct 1 2026 (Nima): steps above are continue-on-error so one failure does not
      # block the commit and deploy, but a failure must never look like success.
      # This step lists every step's outcome and fails the run if any failed.
      - name: Report step outcomes (fails the run if any step failed)
        if: always()
        run: |
          fail=0
          echo "## Step outcomes" >> "$GITHUB_STEP_SUMMARY"
          for kv in "Run Auto-Content for NBA=${{ steps.warn1.outcome }}" "Run Auto-Content for NHL=${{ steps.warn2.outcome }}" "Run Auto-Content for NFL=${{ steps.warn3.outcome }}" "Run Auto-Content for NCAAB=${{ steps.warn4.outcome }}" "Run Auto-Content for NCAAF=${{ steps.warn5.outcome }}" "Run Auto-Content for Soccer=${{ steps.warn6.outcome }}"; do
            echo "- ${kv}" | tee -a "$GITHUB_STEP_SUMMARY"
            case "$kv" in *=failure) fail=1 ;; esac
          done
          if [ "$fail" = 1 ]; then
            echo "::error::One or more steps failed. Their output above is stale or missing; see the list."
            exit 1
          fi
